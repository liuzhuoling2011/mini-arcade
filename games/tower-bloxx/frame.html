<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3a6db5">
<title>盖大楼</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app">
  <canvas id="game" width="360" height="560" aria-label="盖大楼"></canvas>

  <div class="hud" id="hud">
    <div class="top-hud">
      <div class="star-row">
        <span class="star-ico" aria-hidden="true">★</span>
        <div class="star-bar"><i id="comboFill"></i></div>
        <span class="mult" id="mult">x1</span>
      </div>
    </div>
    <div class="bottom-hud">
      <div class="bl">
        <span class="b-ico" aria-hidden="true">🏢</span>
        <div class="bl-meta">
          <b id="floors">000</b>
          <div class="seg" id="stabSeg" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="hint" id="hint">点屏幕 / 空格放下</div>
      <div class="br">
        <span class="p-ico" aria-hidden="true">👤</span>
        <b id="pop">00000</b>
      </div>
    </div>
  </div>

  <div class="softkeys" aria-hidden="true"><span></span><span></span></div>

  <div class="overlay" id="startOverlay">
    <div class="modal">
      <h2>Tower Bloxx</h2>
      <p>诺基亚经典盖楼：吊钩摇摆放下楼层。对准则涨人口与倍乘；偏了整塔会晃，晃狠了小人会跳下去。</p>
      <p class="best">最高人口 <strong id="bestPop">0</strong></p>
      <button type="button" class="btn" id="btnStart">开始盖楼</button>
    </div>
  </div>
  <div class="overlay" id="endOverlay" hidden>
    <div class="modal">
      <h2 id="endTitle">倒塌了</h2>
      <p id="endMsg"></p>
      <button type="button" class="btn" id="btnAgain">再来一栋</button>
    </div>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
