<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a6ad4">
<title>盖大楼</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app">
  <canvas id="game" width="360" height="480" aria-label="盖大楼"></canvas>

  <div class="overlay" id="startOverlay">
    <div class="modal">
      <h2>盖大楼</h2>
      <p>复刻诺基亚 Tower Bloxx：吊钩摇摆放下楼层。完美居中填满星条；在星条耗尽前继续落点可连击倍乘；人口随层数与落点质量上涨；整塔会晃，3 次失手或晃倒即结束。</p>
      <p class="best">最高人口 <strong id="bestPop">0</strong></p>
      <button type="button" class="btn" id="btnStart">开始盖楼</button>
    </div>
  </div>
  <div class="overlay" id="endOverlay" hidden>
    <div class="modal">
      <h2 id="endTitle">倒塌了</h2>
      <p id="endMsg"></p>
      <button type="button" class="btn" id="btnAgain">再来一栋</button>
    </div>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
